# HFS wrapper operations contract consumed by scripts/verify_hfs_storage.py.
# Upstream Octop runtime configuration lives at /data/.octop/config.json.

[storage]
bucket = "BlueSkyXN/octop-all-in-one-hfs-data"
mount_path = "/data"
read_only = false

[paths]
home = "/data"
octop_home = "/data/.octop"
cache_root = "/tmp/octop-cache"

[backup]
auto_enabled = true
schedule = "cron:0 4 * * *"
retention_count = 7
